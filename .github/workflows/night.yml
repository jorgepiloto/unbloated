name: night
on:
  schedule:
    - cron: "0 8 * * *"
      timezone: Europe/Madrid
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: night-${{ github.ref }}
  cancel-in-progress: true
jobs:
  latex-book:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build:adapters
      - run: npm run check:adapters
      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk lmodern texlive-luatex texlive-latex-extra texlive-fonts-recommended
      - name: Compile and Check the Book
        working-directory: packages/latex
        run: bash tests/check.sh
      - name: Test core CSS in isolated LaTeX consumers
        run: node --test tests/latex.integration.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unbloated-latex-example
          path: packages/latex/build/*.pdf
          if-no-files-found: error
          retention-days: 7
  adapter-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: python -m pip install build hatchling
      - run: npm run test:adapters
      - run: python -m unittest discover -s tests -p test_adapter_bundles.py
      - run: npm run build:adapters
      - run: npm run check:adapters
      - run: npm run pack:adapters
      - run: python scripts/check-adapter-artifacts.py
      - name: Test installed Sphinx wheel
        run: |
          python -m pip install .cache/artifacts/*.whl
          python -m unittest discover -s packages/sphinx/tests/python
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:adapter-browser -- --grep Sphinx
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: adapter-packages
          path: .cache/artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  doc-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - unbloated
          - sphinx-unbloated-theme
          - unbloated-hugo-theme
          - quarto-unbloated-theme
          - unbloated-book
    env:
      DOCS_PROJECT: ${{ matrix.project }}
      DOCS_CHANNEL: dev
      DOCS_SOURCE_REF: ${{ github.sha }}
      DOCS_ARTIFACT_DIR: .cache/project-docs/${{ matrix.project }}/dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run docs:setup
      - name: Prepare Sphinx Python environment
        if: matrix.project == 'sphinx-unbloated-theme'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Sphinx dependencies
        if: matrix.project == 'sphinx-unbloated-theme'
        run: |
          npm run build:adapters
          python -m pip install "pip>=25.1"
          python -m pip install --group packages/sphinx/pyproject.toml:doc ./packages/sphinx
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc lmodern texlive-luatex texlive-latex-extra texlive-fonts-recommended
      - name: Install Quarto for Sphinx PDF downloads
        if: matrix.project == 'sphinx-unbloated-theme'
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.11.5"
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run docs:project -- "$DOCS_PROJECT" "$DOCS_CHANNEL"
      - run: npm run test:project-docs
      - if: matrix.project == 'unbloated'
        run: npm run test:docs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: documentation-${{ matrix.project }}-dev
          path: .cache/project-docs/${{ matrix.project }}/dev
          if-no-files-found: error
          retention-days: 7
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run docs:setup
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run build:check
      - run: npm test
      - run: npm run test:browser
      - run: npm audit signatures
      - run: npm audit --audit-level=low
  build-library:
    needs: [doc-build, tests, latex-book, adapter-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: night-package
          path: unbloated-*.tgz
          if-no-files-found: error
          retention-days: 7
  doc-deploy-dev:
    needs: build-library
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: website-documentation
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: documentation-*
          merge-multiple: false
          path: documentation
      - name: Deploy unbloated dev documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: jorgepiloto/website
          publish_dir: documentation/documentation-unbloated-dev
          publish_branch: gh-pages
          destination_dir: projects/unbloated/version/dev
      - name: Deploy sphinx-unbloated-theme dev documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: jorgepiloto/website
          publish_dir: documentation/documentation-sphinx-unbloated-theme-dev
          publish_branch: gh-pages
          destination_dir: projects/sphinx-unbloated-theme/version/dev
      - name: Deploy unbloated-hugo-theme dev documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: jorgepiloto/website
          publish_dir: documentation/documentation-unbloated-hugo-theme-dev
          publish_branch: gh-pages
          destination_dir: projects/unbloated-hugo-theme/version/dev
      - name: Deploy quarto-unbloated-theme dev documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: jorgepiloto/website
          publish_dir: documentation/documentation-quarto-unbloated-theme-dev
          publish_branch: gh-pages
          destination_dir: projects/quarto-unbloated-theme/version/dev
      - name: Deploy unbloated-book dev documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: jorgepiloto/website
          publish_dir: documentation/documentation-unbloated-book-dev
          publish_branch: gh-pages
          destination_dir: projects/unbloated-book/version/dev
