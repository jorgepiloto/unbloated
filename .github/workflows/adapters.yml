name: adapter-packages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adapters-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: python -m pip install build hatchling
      - run: npm run test:adapters
      - run: python -m unittest discover -s tests -p test_adapter_bundles.py
      - run: npm run build:adapters
      - run: npm run check:adapters
      - run: npm run pack:adapters
      - run: python scripts/check-adapter-artifacts.py
      - name: Test installed Sphinx wheel
        run: |
          python -m pip install .artifacts/*.whl
          python -m unittest discover -s packages/sphinx/tests/python
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: adapter-packages
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
