name: pull-request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  labeler:
    name: Labels
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update labels
        uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c # v1.3.0
        with:
          manifest: .github/labels.yml
          prune: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Label pull request
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
  code-style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: python -m pip install pre-commit==4.6.2
      - run: pre-commit run --config config/pre-commit.yaml --all-files --show-diff-on-failure
  actions-style:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
  adapter-latex:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build:adapters
      - run: npm run check:adapters
      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk lmodern texlive-luatex texlive-latex-extra texlive-fonts-recommended
      - name: Compile and Check LaTeX Adapter Consumers
        working-directory: packages/latex
        run: bash tests/check.sh
      - name: Test core CSS in isolated LaTeX consumers
        run: node --test tests/latex.integration.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unbloated-latex-example
          path: packages/latex/build/*.pdf
          if-no-files-found: error
          retention-days: 7
  adapter-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: python -m pip install build hatchling
      - run: npm run test:adapters
      - run: python -m unittest discover -s tests -p test_adapter_bundles.py
      - run: npm run build:adapters
      - run: npm run check:adapters
      - run: npm run pack:adapters
      - run: python scripts/check-adapter-artifacts.py
      - name: Test installed Sphinx wheel
        run: |
          python -m pip install .cache/artifacts/*.whl
          python -m unittest discover -s packages/sphinx/tests/python
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:adapter-browser -- --grep Sphinx
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: adapter-packages
          path: .cache/artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  doc-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - unbloated
          - sphinx-unbloated-theme
          - unbloated-hugo-theme
          - quarto-unbloated-theme
          - unbloated-book
    env:
      DOCS_PROJECT: ${{ matrix.project }}
      DOCS_CHANNEL: dev
      DOCS_SOURCE_REF: ${{ github.sha }}
      DOCS_ARTIFACT_DIR: .cache/project-docs/${{ matrix.project }}/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run docs:setup
      - name: Prepare Sphinx Python environment
        if: matrix.project == 'sphinx-unbloated-theme'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Sphinx dependencies
        if: matrix.project == 'sphinx-unbloated-theme'
        run: |
          npm run build:adapters
          python -m pip install "pip>=25.1"
          python -m pip install --group packages/sphinx/pyproject.toml:doc ./packages/sphinx
      - name: Install TeX for rendered documentation
        if: matrix.project == 'sphinx-unbloated-theme' || matrix.project == 'unbloated-book'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc latexmk lmodern texlive-luatex texlive-latex-extra texlive-fonts-recommended
      - name: Install Quarto for rendered documentation
        if: matrix.project == 'sphinx-unbloated-theme' || matrix.project == 'quarto-unbloated-theme'
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.11.5"
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run docs:project -- "$DOCS_PROJECT" "$DOCS_CHANNEL"
      - run: npm run test:project-docs
      - if: matrix.project == 'unbloated'
        run: npm run test:docs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: documentation-${{ matrix.project }}-dev
          path: .cache/project-docs/${{ matrix.project }}/dev
          if-no-files-found: error
          retention-days: 7
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run docs:setup
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run build:check
      - run: npm test
      - run: npm run test:browser
      - run: npm audit signatures
      - run: npm audit --audit-level=high
  build-library:
    needs:
      [
        code-style,
        actions-style,
        doc-build,
        tests,
        adapter-latex,
        adapter-packages,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pull-request-package
          path: unbloated-*.tgz
          if-no-files-found: error
          retention-days: 7
