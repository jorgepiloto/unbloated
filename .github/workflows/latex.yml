name: latex-package
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true
jobs:
  book:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk lmodern texlive-luatex texlive-latex-extra texlive-fonts-recommended
      - name: Compile and Check the Book
        working-directory: packages/latex
        run: bash tests/check.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unbloated-latex-example
          path: packages/latex/build/*.pdf
          if-no-files-found: error
          retention-days: 7
