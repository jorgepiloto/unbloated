name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  code-style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: python -m pip install pre-commit==4.6.2
      - run: pre-commit run --config config/pre-commit.yaml --all-files --show-diff-on-failure
  actions-style:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
  adapter-latex:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build:adapters
      - run: npm run check:adapters
      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk lmodern texlive-luatex texlive-latex-extra texlive-fonts-recommended
      - name: Compile and Check LaTeX Adapter Consumers
        working-directory: packages/latex
        run: bash tests/check.sh
      - name: Test core CSS in isolated LaTeX consumers
        run: node --test tests/latex.integration.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unbloated-latex-example
          path: packages/latex/build/*.pdf
          if-no-files-found: error
          retention-days: 30
  adapter-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: python -m pip install build hatchling
      - run: npm run test:adapters
      - run: python -m unittest discover -s tests -p test_adapter_bundles.py
      - run: npm run build:adapters
      - run: npm run check:adapters
      - run: npm run pack:adapters
      - run: python scripts/check-adapter-artifacts.py
      - name: Test installed Sphinx wheel
        run: |
          python -m pip install .cache/artifacts/*.whl
          python -m unittest discover -s packages/sphinx/tests/python
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:adapter-browser -- --grep Sphinx
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: adapter-packages
          path: .cache/artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  doc-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - unbloated
          - sphinx-unbloated-theme
          - unbloated-hugo-theme
          - quarto-unbloated-theme
          - unbloated-book
    env:
      DOCS_PROJECT: ${{ matrix.project }}
      DOCS_CHANNEL: stable
      DOCS_SOURCE_REF: ${{ github.sha }}
      DOCS_ARTIFACT_DIR: .cache/project-docs/${{ matrix.project }}/stable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run docs:setup
      - name: Prepare Sphinx Python environment
        if: matrix.project == 'sphinx-unbloated-theme'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Sphinx dependencies
        if: matrix.project == 'sphinx-unbloated-theme'
        run: |
          npm run build:adapters
          python -m pip install "pip>=25.1"
          python -m pip install --group packages/sphinx/pyproject.toml:doc ./packages/sphinx
      - name: Install TeX for rendered documentation
        if: matrix.project == 'sphinx-unbloated-theme' || matrix.project == 'unbloated-book'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc latexmk lmodern texlive-luatex texlive-latex-extra texlive-fonts-recommended
      - name: Install Quarto for rendered documentation
        if: matrix.project == 'sphinx-unbloated-theme' || matrix.project == 'quarto-unbloated-theme'
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.11.5"
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run docs:project -- "$DOCS_PROJECT" "$DOCS_CHANNEL"
      - run: npm run test:project-docs
      - if: matrix.project == 'unbloated'
        run: npm run test:docs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: documentation-${{ matrix.project }}-stable
          path: .cache/project-docs/${{ matrix.project }}/stable
          if-no-files-found: error
          retention-days: 30
      - name: Read core release version
        if: matrix.project == 'unbloated'
        run: printf 'RELEASE_VERSION=%s\n' "$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
      - name: Build versioned core documentation
        if: matrix.project == 'unbloated'
        run: npm run docs:project -- unbloated "$RELEASE_VERSION"
      - name: Validate versioned core documentation
        if: matrix.project == 'unbloated'
        env:
          DOCS_ARTIFACT_DIR: .cache/project-docs/unbloated/${{ env.RELEASE_VERSION }}
        run: |
          npm run test:project-docs
          npm run test:docs
      - if: matrix.project == 'unbloated'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: documentation-unbloated-versioned
          path: .cache/project-docs/unbloated/${{ env.RELEASE_VERSION }}
          if-no-files-found: error
          retention-days: 30
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate release tag and branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.RELEASE_TAG !== `v${version}` || !/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error("Release tag must match the stable package version.");
            }
          NODE
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci --ignore-scripts
      - run: npm run docs:setup
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run build:check
      - run: npm test
      - run: npm run test:browser
      - run: npm audit signatures
      - run: npm audit --audit-level=high
  build-library:
    needs:
      [
        code-style,
        actions-style,
        doc-build,
        tests,
        adapter-latex,
        adapter-packages,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-package
          path: unbloated-*.tgz
          if-no-files-found: error
          retention-days: 30
  release-npm:
    needs: build-library
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-package
      - name: Publish verified tarball through npm trusted publishing
        run: npm publish unbloated-*.tgz --ignore-scripts --access public --provenance
  release-github:
    needs: [build-library, release-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-package
      - name: Create GitHub release with the published tarball
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" unbloated-*.tgz --verify-tag --generate-notes --title "$RELEASE_TAG" --latest
  doc-deploy-stable:
    needs: [release-github, doc-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: website-documentation
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: documentation-*
          merge-multiple: false
          path: documentation
      - name: Read release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: printf 'RELEASE_VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Deploy versioned core documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: jorgepiloto/website
          publish_dir: documentation/documentation-unbloated-versioned
          publish_branch: gh-pages
          destination_dir: projects/unbloated/version/${{ env.RELEASE_VERSION }}
      - name: Deploy unbloated stable documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: jorgepiloto/website
          publish_dir: documentation/documentation-unbloated-stable
          publish_branch: gh-pages
          destination_dir: projects/unbloated/version/stable
      - name: Deploy sphinx-unbloated-theme stable documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: jorgepiloto/website
          publish_dir: documentation/documentation-sphinx-unbloated-theme-stable
          publish_branch: gh-pages
          destination_dir: projects/sphinx-unbloated-theme/version/stable
      - name: Deploy unbloated-hugo-theme stable documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: jorgepiloto/website
          publish_dir: documentation/documentation-unbloated-hugo-theme-stable
          publish_branch: gh-pages
          destination_dir: projects/unbloated-hugo-theme/version/stable
      - name: Deploy quarto-unbloated-theme stable documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: jorgepiloto/website
          publish_dir: documentation/documentation-quarto-unbloated-theme-stable
          publish_branch: gh-pages
          destination_dir: projects/quarto-unbloated-theme/version/stable
      - name: Deploy unbloated-book stable documentation
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: jorgepiloto/website
          publish_dir: documentation/documentation-unbloated-book-stable
          publish_branch: gh-pages
          destination_dir: projects/unbloated-book/version/stable
