{{ define "main" }}
<main>
    <section class="page-content">
      {{ .Content }}
      <h2>Latest posts</h2>
    </section>
    <ul class="posts">
    {{ range ( first .Site.Params.Lastposts ( where .Site.RegularPages "Section" "posts" ).ByDate.Reverse ) }}
        <li>
            {{ .Date.Format "2006-01-02" }} - <a href="{{ .Permalink }}">{{ .Title }}{{ if .Params.Subtitle}} - {{ .Params.Subtitle }}{{ end }}</a>
        </li>
    {{ end}}
    </ul>
</main>
{{ end }}
