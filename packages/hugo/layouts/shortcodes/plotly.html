{{ $json := .Get "json" }}
{{ $height := .Get "height" | default "200px" }}
{{ if $json }}
<div id="{{ $json | htmlEscape }}" class="plotly" style="height:{{ $height | htmlEscape }}"></div>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    const plotId = {{ $json }};
    const container = document.getElementById(plotId);
    try {
        const response = await fetch(plotId);
        if (!response.ok) {
            throw new Error(`Unable to load plot: ${response.status}`);
        }
        const figure = await response.json();
        await Plotly.newPlot(container, figure.data, figure.layout, { responsive: true });
    } catch (error) {
        console.error("Error loading Plotly visualization:", error);
        container.textContent = "The plot could not be loaded.";
    }
}, { once: true });
</script>
{{ else }}
<p>Error: No JSON URL provided for Plotly visualization.</p>
{{ end }}
