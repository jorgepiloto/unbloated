site_name: Unbloated
site_description: Monospace CSS, grayscale surfaces, and square components.
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true
theme:
  name: null
  custom_dir: docs/theme
plugins: []
exclude_docs: |
  /theme/
  /requirements.in
  /requirements.txt
markdown_extensions:
  - fenced_code
  - tables
  - toc:
      permalink: "#"
extra_css:
  - assets/unbloat.css
  - assets/site.css
extra_javascript:
  - assets/tabs.js
nav:
  - Home: index.md
  - Getting Started:
      - About: getting-started/about.md
      - Prerequisites: getting-started/prerequisites.md
      - Installation: getting-started/installation.md
      - Design Tokens: reference/tokens.md
      - Source Reference: reference/source.md
      - Release Setup: releasing.md
  - Components:
      - Overview: components/index.md
      - Typography: components/typography.md
      - Form Controls: components/controls.md
      - Buttons and Tags: components/buttons.md
      - Panels and Callouts: components/panels.md
      - Tabs: components/tabs.md
      - Tables and Details: components/content.md
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
